# Copy to backend.yml and fill secrets.
# database_url: leave empty / omit for SQLite at db/backend_db.sqlite3

backend_bot_token: ""
admin_id: 0
tg_bot_username: ""

uvicorn_host: "0.0.0.0"
uvicorn_port: 5001

api_token: "change-me-service-token"
admin_login: "admin"
admin_password: "change-me-strong-password"
# Optional: separate HMAC secret for admin sessions (otherwise derived from login+password+api_token)
# admin_session_secret: "long-random-string"
# admin_session_ttl: 43200

# Postgres (recommended). Docker Compose service hostname is store-postgres
# (not `postgres` — that name collides with xray-vpn-bot on backend-network):
# database_url: "postgresql+asyncpg://store:store@store-postgres:5432/store"
# From the host: postgresql+asyncpg://store:store@127.0.0.1:5433/store
# Local SQLite default if omitted:
# database_url: "sqlite+aiosqlite:///db/backend_db.sqlite3"

remnawave_url: ""
remnawave_token: ""
rw_free_id: ""
rw_france_id: ""
rw_germany_id: ""
rw_premium_id: ""

dig_pass: ""
dig_seller_id: ""
dig_api_key: ""
dig_url: "https://api.digiseller.com"

ggsel_seller_id: ""
ggsel_api_key: ""
ggsel_base_url: "https://seller.ggsel.com"
# Optional override for GGsel product options API host (default: ggsel_base_url)
# ggsel_options_url: "https://seller.ggsel.com"
ggsel_check_interval: 1
ggsel_top_value: 50
ggsel_request_retries: 3
ggsel_retry_timeout: 5
ggsel_error_threshold: 5
