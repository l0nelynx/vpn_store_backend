# Copy to backend.yml and fill secrets.
# Store v2 is PostgreSQL-only.

backend_bot_token: ""
admin_id: 0
tg_bot_username: ""

uvicorn_host: "0.0.0.0"
uvicorn_port: 5001

api_token: "change-me-service-token"
admin_login: "admin"
admin_password: "change-me-strong-password"
# Prefer an Argon2 hash in production; legacy plaintext is accepted only for migration.
# admin_password_hash: "$argon2id$..."
jwt_secret: "replace-with-at-least-32-random-bytes"
master_key: "replace-with-an-independent-random-secret"
admin_access_ttl: 900
admin_refresh_ttl: 2592000
admin_cookie_secure: true

# Docker Compose service hostname is store-postgres
# (not `postgres` — that name collides with xray-vpn-bot on backend-network):
database_url: "postgresql+asyncpg://store:store@store-postgres:5432/store"
# From the host: postgresql+asyncpg://store:store@127.0.0.1:5433/store

remnawave_url: ""
remnawave_token: ""
rw_free_id: ""
rw_france_id: ""
rw_germany_id: ""
rw_premium_id: ""

dig_pass: ""
dig_seller_id: ""
dig_api_key: ""
dig_url: "https://api.digiseller.com"

ggsel_seller_id: ""
ggsel_api_key: ""
ggsel_base_url: "https://seller.ggsel.com"
# Optional override for GGsel product options API host (default: ggsel_base_url)
# ggsel_options_url: "https://seller.ggsel.com"
ggsel_check_interval: 1
ggsel_top_value: 50
ggsel_request_retries: 3
ggsel_retry_timeout: 5
ggsel_error_threshold: 5
