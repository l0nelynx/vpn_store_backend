services:
  # Service name must NOT be `postgres` — that hostname collides on the shared
  # external `backend-network` with xray-vpn-bot dual-homed containers, which
  # resolve DATABASE_URL host `postgres` and then hit this DB (wrong user/pass).
  store-postgres:
    image: postgres:16-alpine
    container_name: store-postgres
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: store
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    ports:
      # Host 5433 — xray-vpn-bot already binds 127.0.0.1:5432
      - "127.0.0.1:5433:5432"
    networks:
      - store-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d store"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-bot:
    container_name: backend-bot
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      store-postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./db
        target: /usr/src/app/db
      - ./backend.yml:/usr/src/app/backend.yml
      - ./admin/dist:/usr/src/app/admin/dist:ro
    ports:
      - "127.0.0.1:5001:5001"
    networks:
      # Private: talk to store-postgres by hostname `store-postgres`
      - store-network
      # Shared with xray edge nginx — do NOT put Postgres on this network
      - backend-network
    restart: unless-stopped

networks:
  store-network:
    name: store-network
    driver: bridge
  backend-network:
    name: backend-network
    driver: bridge
    external: true
