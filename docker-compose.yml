x-store-app-environment: &store-app-environment
  # Never reuse a host-side STORE_DATABASE_URL here: 127.0.0.1:5433 is valid
  # only from the host. Containers must reach Postgres over the Compose network.
  STORE_DATABASE_URL: ${STORE_DOCKER_DATABASE_URL:-postgresql+asyncpg://store:store@store-postgres:5432/store}

services:
  # Service name must NOT be `postgres` — that hostname collides on the shared
  # external `backend-network` with xray-vpn-bot dual-homed containers, which
  # resolve DATABASE_URL host `postgres` and then hit this DB (wrong user/pass).
  store-postgres:
    image: postgres:16-alpine
    container_name: store-postgres
    environment:
      POSTGRES_USER: store
      POSTGRES_PASSWORD: store
      POSTGRES_DB: store
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    ports:
      # Host 5433 — xray-vpn-bot already binds 127.0.0.1:5432
      - "127.0.0.1:5433:5432"
    networks:
      - store-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U store -d store"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-bot:
    container_name: backend-bot
    build:
      context: .
      dockerfile: Dockerfile
    environment: *store-app-environment
    depends_on:
      store-postgres:
        condition: service_healthy
      store-migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend.yml:/usr/src/app/backend.yml
      - ./admin/dist:/usr/src/app/admin/dist:ro
    ports:
      - "127.0.0.1:5001:5001"
    networks:
      # Private: talk to store-postgres by hostname `store-postgres`
      - store-network
      # Shared with xray edge nginx — do NOT put Postgres on this network
      - backend-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5001/store/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  store-worker:
    container_name: store-worker
    build:
      context: .
      dockerfile: Dockerfile
    environment: *store-app-environment
    command: ["python", "-m", "store.worker"]
    depends_on:
      store-postgres:
        condition: service_healthy
      store-migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend.yml:/usr/src/app/backend.yml:ro
    networks:
      - store-network
      - backend-network
    restart: unless-stopped

  store-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *store-app-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      store-postgres:
        condition: service_healthy
    volumes:
      - ./backend.yml:/usr/src/app/backend.yml:ro
    networks:
      - store-network
    restart: "no"

networks:
  store-network:
    name: store-network
    driver: bridge
  backend-network:
    name: backend-network
    driver: bridge
    external: true
